<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — FoodRush 🗺️</title>
  <meta name="description" content="Track your food order in real-time." />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .map-placeholder { width: 100%; height: 400px; border-radius: var(--radius); background: var(--dark2); border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
    .map-placeholder::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.03) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.03) 40px); }
    .delivery-bike { font-size: 2rem; position: absolute; transition: left 1s ease, top 1s ease; z-index: 2; }
    .pin-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 2; }
    .map-label { font-size: 0.7rem; color: var(--text-secondary); }
    .route-line { position: absolute; border-top: 2px dashed rgba(255, 107, 53, 0.5); top: 48%; left: 22%; right: 22%; z-index: 1; }
    .eta-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(255, 107, 53, 0.15); border: 1px solid rgba(255, 107, 53, 0.3); color: var(--primary); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; }
  </style>
</head>

<body>
  <div class="bg-gradient"></div>
  <div id="toast-container"></div>

  <nav class="navbar" id="navbar"></nav>

  <div class="tracking-wrapper fade-in">
    <h2 class="section-title">🗺️ Order Tracking</h2>

    <div class="tracking-info-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
        <div>
          <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.25rem;">Order ID</div>
          <div style="font-weight:700;font-size:1rem;" id="display-order-id">—</div>
        </div>

        <div>
          <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.25rem;">Order Time</div>
          <div style="font-weight:700;font-size:0.95rem;" id="display-order-time">—</div>
        </div>

        <div>
          <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.25rem;">Total Paid</div>
          <div style="font-weight:800;color:var(--secondary);font-size:1.1rem;" id="display-total">—</div>
        </div>

        <div>
          <span class="eta-chip" id="eta-chip">⏱️ ETA: 33 sec</span>
        </div>
      </div>

      <div id="status-label" style="font-size:1.3rem;font-weight:800;margin-top:1rem;">⏳ Order Placed</div>

      <button class="btn btn-danger" id="cancel-btn" style="margin-top:1rem;" onclick="cancelOrder()">
        ❌ Cancel Order
      </button>
    </div>

    <div class="map-placeholder" id="map-area">
      <div class="route-line"></div>

      <div class="pin-wrapper" style="top:30%;left:15%;">
        <div style="font-size:2rem;">🏪</div>
        <div class="map-label">Restaurant</div>
      </div>

      <div class="pin-wrapper" style="top:45%;right:15%;">
        <div style="font-size:2rem;">🏠</div>
        <div class="map-label">Your Location</div>
      </div>

      <div class="delivery-bike" id="delivery-bike" style="top:35%;left:20%;">🛵</div>

      <div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:50px;font-size:0.75rem;color:var(--text-secondary);z-index:2;">
        📍 Demo live delivery tracking
      </div>
    </div>

    <div class="tracking-info-card">
      <h3 class="panel-title">📍 Delivery Progress</h3>

      <div class="status-timeline" id="status-timeline">
        <div class="status-timeline-bar" id="timeline-bar" style="width:0%"></div>

        <div class="status-step">
          <div class="step-icon" id="step-0">✅</div>
          <div class="step-label" id="step-label-0">Order Placed</div>
        </div>

        <div class="status-step">
          <div class="step-icon" id="step-1">👨‍🍳</div>
          <div class="step-label" id="step-label-1">Preparing</div>
        </div>

        <div class="status-step">
          <div class="step-icon" id="step-2">🛵</div>
          <div class="step-label" id="step-label-2">Out for Delivery</div>
        </div>

        <div class="status-step">
          <div class="step-icon" id="step-3">🏠</div>
          <div class="step-label" id="step-label-3">Delivered</div>
        </div>
      </div>
    </div>

    <div class="tracking-info-card">
      <h3 class="panel-title">🍽️ Items Ordered</h3>
      <div id="tracking-items"></div>
    </div>

    <button class="btn btn-primary" onclick="window.location.href='home.html'">
      ← Back to Menu
    </button>
  </div>

  <footer class="site-footer">© 2026 FoodRush | Built using MERN Stack</footer>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>

  <script>
    if (!protectUserPage()) throw new Error("Not logged in");

    const STATUSES = ["Order Placed", "Preparing", "Out for Delivery", "Delivered"];
    const STATUS_WIDTHS = ["0%", "33%", "66%", "100%"];
    const STEP_EMOJIS = ["✅", "👨‍🍳", "🛵", "🏠"];

    const BIKE_POSITIONS = [
      { top: "35%", left: "20%" },
      { top: "35%", left: "35%" },
      { top: "40%", left: "55%" },
      { top: "45%", left: "72%" }
    ];

    let order = null;
    let demoTimers = [];
    let countdownTimer = null;
    let secondsLeft = 33;
    let deliveredMailSent = false;

    (async () => {
      renderNavbar("tracking");
      await loadOrder();

      if (order && !["Delivered", "Cancelled"].includes(order.status)) {
        startDemoTracking();
      }
    })();

    async function loadOrder() {
      const orderId = sessionStorage.getItem("foodrush_pending_order");

      if (!orderId) {
        showToast("No order found. Redirecting...", "error");

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1200);

        return;
      }

      try {
        order = await apiRequest(`/orders/${orderId}`);

        renderOrderInfo();
        renderItems();
        updateStatusUI();

        if (order.status === "Delivered") {
          updateEta(0);
        }

      } catch (err) {
        showToast("Order not found.", "error");
      }
    }

    function renderOrderInfo() {
      document.getElementById("display-order-id").textContent = order.orderId;
      document.getElementById("display-order-time").textContent = order.createdAt ? formatDate(order.createdAt) : "—";
      document.getElementById("display-total").textContent = `₹${order.totalPrice}`;
    }

    function renderItems() {
      document.getElementById("tracking-items").innerHTML = order.items.map(item => `
        <div class="summary-row" style="padding:0.5rem 0;border-bottom:1px solid var(--card-border);">
          <span>
            ${item.name}
            <span style="color:var(--text-muted)">×${item.quantity}</span>
          </span>
          <span>₹${item.price * item.quantity}</span>
        </div>
      `).join("");
    }

    function startDemoTracking() {
      const trackingKey = `foodrush_tracking_start_${order.orderId}`;

      let startTime = sessionStorage.getItem(trackingKey);

      if (!startTime) {
        startTime = Date.now();
        sessionStorage.setItem(trackingKey, startTime);
      }

      const elapsed = Math.floor((Date.now() - Number(startTime)) / 1000);
      secondsLeft = Math.max(33 - elapsed, 0);

      if (elapsed >= 30) {
        updateStatus("Delivered");
        updateEta(0);
        markOrderDelivered();
        return;
      }

      if (elapsed >= 20) {
        updateStatus("Out for Delivery");
      } else if (elapsed >= 10) {
        updateStatus("Preparing");
      } else {
        updateStatus("Order Placed");
      }

      updateEta(secondsLeft);

      countdownTimer = setInterval(() => {
        secondsLeft--;
        updateEta(secondsLeft);

        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
        }
      }, 1000);

      if (elapsed < 10) {
        demoTimers.push(setTimeout(() => {
          updateStatus("Preparing");
        }, (10 - elapsed) * 1000));
      }

      if (elapsed < 20) {
        demoTimers.push(setTimeout(() => {
          updateStatus("Out for Delivery");
        }, (20 - elapsed) * 1000));
      }

      demoTimers.push(setTimeout(async () => {
        updateStatus("Delivered");

        await markOrderDelivered();

        showToast("🎉 Order Delivered Successfully!", "success");

        clearInterval(countdownTimer);
        updateEta(0);
      }, Math.max((30 - elapsed) * 1000, 0)));
    }

    async function markOrderDelivered() {
      if (!order || deliveredMailSent) return;

      try {
        const response = await apiRequest(`/orders/delivered/${order.orderId}`, {
          method: "PATCH"
        });

        order = response.order || order;
        deliveredMailSent = true;

        updateStatusUI();

        console.log("Delivered mail sent successfully");

      } catch (err) {
        console.log("Delivery mail failed:", err.message);
      }
    }

    function clearDemoTimers() {
      demoTimers.forEach(timer => clearTimeout(timer));
      demoTimers = [];

      if (countdownTimer) {
        clearInterval(countdownTimer);
      }
    }

    function updateStatus(status) {
      if (!order || order.status === "Cancelled") return;

      order.status = status;
      updateStatusUI();
    }

    async function cancelOrder() {
      if (!order) return;

      if (["Out for Delivery", "Delivered", "Cancelled"].includes(order.status)) {
        return showToast("Order cannot be cancelled now.", "error");
      }

      const btn = document.getElementById("cancel-btn");

      btn.disabled = true;
      btn.textContent = "Cancelling...";

      try {
        order = await apiRequest(`/orders/cancel/${order.orderId}`, {
          method: "PATCH"
        });

        clearDemoTimers();

        sessionStorage.removeItem(`foodrush_tracking_start_${order.orderId}`);

        updateStatusUI();
        updateEta(-1);

        showToast("Order cancelled successfully.", "info");

      } catch (err) {
        showToast(err.message, "error");

        btn.disabled = false;
        btn.textContent = "❌ Cancel Order";
      }
    }

    function updateEta(sec) {
      const etaChip = document.getElementById("eta-chip");

      if (order?.status === "Cancelled") {
        etaChip.textContent = "⏱️ ETA: Cancelled";
      } else if (sec <= 0 || order?.status === "Delivered") {
        etaChip.textContent = "⏱️ ETA: Delivered! 🎉";
      } else {
        etaChip.textContent = `⏱️ ETA: ${sec} sec`;
      }
    }

    function updateStatusUI() {
      const cancelBtn = document.getElementById("cancel-btn");

      if (order.status === "Cancelled") {
        document.getElementById("status-label").textContent = "❌ Cancelled";
        cancelBtn.style.display = "none";
        document.getElementById("timeline-bar").style.width = "0%";
        return;
      }

      const idx = Math.max(STATUSES.indexOf(order.status), 0);

      document.getElementById("status-label").textContent = `${STEP_EMOJIS[idx]} ${STATUSES[idx]}`;
      document.getElementById("timeline-bar").style.width = STATUS_WIDTHS[idx];

      cancelBtn.style.display = idx < 2 ? "inline-flex" : "none";

      STATUSES.forEach((_, i) => {
        const icon = document.getElementById(`step-${i}`);
        const label = document.getElementById(`step-label-${i}`);

        if (i < idx) {
          icon.className = "step-icon done";
          icon.textContent = "✓";
          label.className = "step-label done";
        } else if (i === idx) {
          icon.className = "step-icon active";
          icon.textContent = STEP_EMOJIS[i];
          label.className = "step-label active";
        } else {
          icon.className = "step-icon";
          icon.textContent = STEP_EMOJIS[i];
          label.className = "step-label";
        }
      });

      const bike = document.getElementById("delivery-bike");
      const pos = BIKE_POSITIONS[idx];

      bike.style.top = pos.top;
      bike.style.left = pos.left;
    }
  </script>
</body>
</html>
