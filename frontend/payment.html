<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Payment — FoodRush 💳</title>

  <meta
    name="description"
    content="Complete your food order payment securely."
  />

  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="bg-gradient"></div>

  <div id="toast-container"></div>

  <nav class="navbar" id="navbar"></nav>

  <div class="payment-wrapper fade-in">

    <h2 class="section-title">💳 Checkout</h2>

    <div class="payment-card">

      <h3 class="panel-title">🧾 Order Summary</h3>

      <div id="order-summary-items"></div>

      <div style="margin-top:1rem;">

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="pay-subtotal">₹0</span>
        </div>

        <div class="summary-row">
          <span>GST (5%)</span>
          <span id="pay-gst">₹0</span>
        </div>

        <div class="summary-row">
          <span>🛵 Delivery</span>
          <span>₹40</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="pay-total">₹0</span>
        </div>

      </div>

    </div>

    <div class="payment-card">

      <h3 class="panel-title">📍 Delivery Address</h3>

      <div class="form-group">

        <label class="form-label">
          Address Type
        </label>

        <select class="form-input" id="address-type">
          <option value="Home">🏠 Home</option>
          <option value="Work">🏢 Work</option>
          <option value="Other">📍 Other</option>
        </select>

      </div>

      <div class="form-group">

        <label class="form-label">
          Full Address
        </label>

        <textarea
          class="form-input"
          id="full-address"
          rows="3"
          placeholder="Flat, Street, Area, City..."
        ></textarea>

      </div>

      <div class="form-group">

        <label class="form-label">
          Landmark
        </label>

        <input
          class="form-input"
          id="landmark"
          type="text"
          placeholder="Near mall, bus stop..."
        />

      </div>

      <button
        class="btn btn-secondary btn-full"
        type="button"
        onclick="saveAddressLocally()"
      >
        💾 Save Address
      </button>

      <div
        id="saved-addresses"
        style="margin-top:1rem;"
      ></div>

      <hr
        style="
          margin:2rem 0;
          border-color:rgba(255,255,255,0.1);
        "
      />

      <h3 class="panel-title">
        💰 Select Payment Method
      </h3>

      <div class="payment-methods">

        <div
          class="payment-option"
          id="pm-upi"
          onclick="selectPayment('upi')"
        >
          <span
            style="
              font-size:1.8rem;
              display:block;
              margin-bottom:0.3rem;
            "
          >
            📱
          </span>

          UPI
        </div>

        <div
          class="payment-option"
          id="pm-credit"
          onclick="selectPayment('credit')"
        >
          <span
            style="
              font-size:1.8rem;
              display:block;
              margin-bottom:0.3rem;
            "
          >
            💳
          </span>

          Credit Card
        </div>

        <div
          class="payment-option"
          id="pm-debit"
          onclick="selectPayment('debit')"
        >
          <span
            style="
              font-size:1.8rem;
              display:block;
              margin-bottom:0.3rem;
            "
          >
            🏧
          </span>

          Debit Card
        </div>

        <div
          class="payment-option"
          id="pm-cod"
          onclick="selectPayment('cod')"
        >
          <span
            style="
              font-size:1.8rem;
              display:block;
              margin-bottom:0.3rem;
            "
          >
            💵
          </span>

          Cash on Delivery
        </div>

      </div>

      <div id="payment-fields"></div>

      <div id="alert-box"></div>

      <button
        class="btn btn-primary btn-full"
        onclick="processPayment()"
        id="pay-btn"
        style="margin-top:1rem;"
      >
        🔒 Place Order
      </button>

    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>

  <script>

    if (!protectUserPage()) {
      throw new Error("Not logged in");
    }

    let selectedMethod = null;

    (() => {

      renderNavbar("home");

      renderSavedAddresses();

      if (!window.SESSION.cart.length) {

        showToast("Your cart is empty!", "error");

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1200);

        return;
      }

      renderSummary();

    })();

    function renderSummary() {

      const items = window.SESSION.cart;

      const sub = cartTotal();

      const gst = cartGST(sub);

      const grand = cartGrandTotal();

      document.getElementById("pay-subtotal")
        .textContent = `₹${sub}`;

      document.getElementById("pay-gst")
        .textContent = `₹${gst}`;

      document.getElementById("pay-total")
        .textContent = `₹${grand}`;

      document.getElementById(
        "order-summary-items"
      ).innerHTML = items.map(item => `

        <div
          class="summary-row"
          style="
            padding:0.4rem 0;
            border-bottom:1px solid var(--card-border);
          "
        >

          <span>
            ${item.food.name}

            <span style="color:var(--text-muted)">
              ×${item.quantity}
            </span>
          </span>

          <span>
            ₹${item.food.price * item.quantity}
          </span>

        </div>

      `).join("");

    }

    function selectPayment(method) {

      selectedMethod = method;

      document
        .querySelectorAll(".payment-option")
        .forEach(el => el.classList.remove("selected"));

      document
        .getElementById(`pm-${method}`)
        .classList.add("selected");

      const fields =
        document.getElementById("payment-fields");

      if (method === "upi") {

        fields.innerHTML = `
          <div class="form-group" style="margin-top:1rem;">

            <label class="form-label">
              📱 UPI ID
            </label>

            <input
              class="form-input"
              id="upi-id"
              type="text"
              placeholder="yourname@upi"
            />

          </div>
        `;

      }

      else if (
        method === "credit" ||
        method === "debit"
      ) {

        const label =
          method === "credit"
            ? "Credit"
            : "Debit";

        fields.innerHTML = `

          <div class="form-group" style="margin-top:1rem;">

            <label class="form-label">
              💳 ${label} Card Number
            </label>

            <input
              class="form-input"
              id="card-number"
              type="text"
              placeholder="1234 5678 9012 3456"
              maxlength="19"
              oninput="formatCardNumber(this)"
            />

          </div>

          <div
            style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:1rem;
            "
          >

            <div class="form-group">

              <label class="form-label">
                📅 Expiry
              </label>

              <input
                class="form-input"
                id="card-expiry"
                type="text"
                placeholder="12/27"
                maxlength="5"
              />

            </div>

            <div class="form-group">

              <label class="form-label">
                🔒 CVV
              </label>

              <input
                class="form-input"
                id="card-cvv"
                type="password"
                placeholder="•••"
                maxlength="3"
              />

            </div>

          </div>

          <div class="form-group">

            <label class="form-label">
              👤 Cardholder Name
            </label>

            <input
              class="form-input"
              id="card-name"
              type="text"
              placeholder="Name on card"
            />

          </div>

        `;

      }

      else if (method === "cod") {

        fields.innerHTML = `
          <div
            class="alert alert-info"
            style="margin-top:1rem;"
          >
            💵 You'll pay ₹${cartGrandTotal()}
            when your order arrives.
          </div>
        `;

      }

    }

    function formatCardNumber(input) {

      let val =
        input.value
          .replace(/\D/g, "")
          .substring(0, 16);

      input.value =
        val.replace(/(.{4})/g, "$1 ").trim();

    }

    function validatePayment() {

      if (!selectedMethod) {

        showAlert(
          "alert-box",
          "Please select a payment method.",
          "error"
        );

        return false;
      }

      return true;

    }

    async function processPayment() {

      clearAlert("alert-box");

      if (!validatePayment()) return;

      if (!window.selectedAddress) {

        showAlert(
          "alert-box",
          "Please select delivery address",
          "error"
        );

        return;
      }

      const btn =
        document.getElementById("pay-btn");

      btn.disabled = true;

      btn.innerHTML =
        "⏳ Placing Order...";

      try {

        const items =
          window.SESSION.cart.map(item => ({
            foodId: item.food._id,
            name: item.food.name,
            price: item.food.price,
            quantity: item.quantity,
          }));

        const subtotal = cartTotal();

        const gst = cartGST(subtotal);

        const totalPrice =
          cartGrandTotal();

        const latitude =
          28.6139 +
          (Math.random() - 0.5) * 0.05;

        const longitude =
          77.2090 +
          (Math.random() - 0.5) * 0.05;

        const order = await apiRequest(
          "/orders",
          {
            method: "POST",

            body: JSON.stringify({

              username: currentUsername(),

              address: window.selectedAddress,

              items,

              subtotal,

              gst,

              deliveryFee: 40,

              totalPrice,

              latitude,

              longitude,

              paymentMethod: selectedMethod,

              clientOrderId:
                generateOrderId(),

            }),

          }
        );

        savePendingOrderId(order.orderId);

        cartClear();

        showToast(
          "🎉 Order placed successfully!",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "tracking.html";
        }, 700);

      }

      catch (err) {

        showAlert(
          "alert-box",
          err.message,
          "error"
        );

        btn.disabled = false;

        btn.innerHTML =
          "🔒 Place Order";

      }

    }

  </script>

  <footer class="site-footer">
    © 2026 FoodRush | Built using MERN Stack
  </footer>

</body>
</html>
