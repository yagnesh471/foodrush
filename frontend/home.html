<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — FoodRush 🍔</title>
  <meta name="description" content="Browse our delicious menu and order your favourite meals." />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-gradient"></div>
  <div id="toast-container"></div>

  <nav class="navbar" id="navbar"></nav>

  <div class="modal-overlay" id="orders-modal">
    <div class="modal" style="max-width:700px;max-height:80vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;">
        <h3 class="panel-title" style="margin:0;">📋 Your Orders</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeOrderHistory()">✕ Close</button>
      </div>
      <div id="orders-list"></div>
    </div>
  </div>

  <div class="home-wrapper">
    <div class="menu-section">
      <h2 class="section-title">🍽️ Our Menu</h2>
      <div class="category-filter" id="category-filter">
        <button class="filter-btn active" onclick="filterCategory('All', this)">🍴 All</button>
      </div>
      <div class="food-grid" id="food-grid">
        <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">
          <div class="spinner" style="margin:0 auto 1rem;"></div>
          Loading menu...
        </div>
      </div>
    </div>

    <div class="cart-sidebar">
      <div class="cart-box">
        <h3 class="section-title" style="font-size:1.2rem;">🛒 Your Cart <span id="cart-count-badge" style="font-size:0.85rem;background:var(--primary);color:white;padding:2px 8px;border-radius:50px;vertical-align:middle;"></span></h3>

        <div class="cart-items" id="cart-items"></div>

        <div class="cart-summary" id="cart-summary" style="display:none;">
          <div class="summary-row"><span>Subtotal</span><span id="s-subtotal">₹0</span></div>
          <div class="summary-row"><span>GST (5%)</span><span id="s-gst">₹0</span></div>
          <div class="summary-row"><span>🛵 Delivery</span><span>₹40</span></div>
          <div class="summary-row total"><span>Total</span><span id="s-total">₹0</span></div>
          <button class="btn btn-primary btn-full" id="checkout-btn" style="margin-top:1rem;" onclick="goToPayment()">💳 Proceed to Pay</button>
          <button class="btn btn-secondary btn-full" style="margin-top:0.5rem;" onclick="clearCartUI()">🗑️ Clear Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script>
    if (!protectUserPage()) throw new Error('Not logged in');

    let allFoods = [];
    let activeCategory = 'All';

    (async () => {
      showLoading('Loading menu...');
      renderNavbar('home');
      await loadFoodItems();
      renderCart();
      hideLoading();
    })();

    async function loadFoodItems() {
      try {
        allFoods = await apiRequest('/foods');
        buildCategoryFilter();
        renderFoodGrid(allFoods);
      } catch (err) {
        document.getElementById('food-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--danger);">Failed to load menu.</div>`;
      }
    }

    function buildCategoryFilter() {
      const categories = ['All', ...new Set(allFoods.map(f => f.category))];
      const container = document.getElementById('category-filter');
      container.innerHTML = categories.map(cat => {
        const emojis = { All: '🍴', Burgers: '🍔', Pizza: '🍕', Indian: '🍛', Wraps: '🌯', Drinks: '🥤', Desserts: '🍰' };
        const icon = emojis[cat] || '🍽️';
        return `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${icon} ${cat}</button>`;
      }).join('');
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = cat === 'All' ? allFoods : allFoods.filter(f => f.category === cat);
      renderFoodGrid(filtered);
    }

    function renderFoodGrid(foods) {
      const grid = document.getElementById('food-grid');
      if (!foods.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);">No items found in this category.</div>`;
        return;
      }

      grid.innerHTML = foods.map(food => `
        <div class="food-card fade-in">
          <img class="food-card-img" src="${food.image_url}" alt="${food.name}"
               onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400&auto=format&fit=crop'"
               loading="lazy" />
          <div class="food-card-body">
            <div class="food-card-cat">${food.category}</div>
            <div class="food-card-name">${food.name}</div>
            <div class="food-card-footer">
              <span class="food-price">₹${food.price}</span>
              <button class="add-btn" onclick='addFoodToCart(${JSON.stringify(food)})'>➕ Add</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addFoodToCart(food) {
      cartAdd(food);
      renderCart();
      showToast(`${food.name} added to cart! 🛒`, 'success');
    }

    function renderCart() {
      const itemsContainer = document.getElementById('cart-items');
      const summaryContainer = document.getElementById('cart-summary');
      const badge = document.getElementById('cart-count-badge');
      const count = cartCount();
      badge.textContent = count > 0 ? count : '';

      if (!window.SESSION.cart.length) {
        itemsContainer.innerHTML = `
          <div class="cart-empty">
            <div style="font-size:3rem;margin-bottom:1rem;">🛒</div>
            <p>Your cart is empty 🍔</p>
            <small style="color:var(--text-muted);">Add some delicious items!</small>
          </div>`;
        summaryContainer.style.display = 'none';
        return;
      }

      itemsContainer.innerHTML = window.SESSION.cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.food.name}</div>
            <div class="cart-item-price">₹${item.food.price} × ${item.quantity}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty('${item.food._id}', -1)">−</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty('${item.food._id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      const sub = cartTotal();
      const gst = cartGST(sub);
      const grand = cartGrandTotal();
      document.getElementById('s-subtotal').textContent = `₹${sub}`;
      document.getElementById('s-gst').textContent = `₹${gst}`;
      document.getElementById('s-total').textContent = `₹${grand}`;
      summaryContainer.style.display = 'block';
    }

    function changeQty(foodId, delta) {
      if (delta === 1) {
        const food = allFoods.find(f => f._id === foodId);
        if (food) cartAdd(food);
      } else {
        cartRemove(foodId);
      }
      renderCart();
    }

    function clearCartUI() {
      cartClear();
      renderCart();
      showToast('Cart cleared 🗑️', 'info');
    }

    function goToPayment() {
      if (!window.SESSION.cart.length) {
        showToast('Your cart is empty!', 'error');
        return;
      }
      window.location.href = 'payment.html';
    }

    async function renderOrderHistoryModal() {
      const modal = document.getElementById('orders-modal');
      modal.classList.add('active');
      const list = document.getElementById('orders-list');
      list.innerHTML = '<div style="padding:1rem;color:var(--text-muted);">Loading orders...</div>';

      try {
        const username = currentUsername();
        const orders = await apiRequest(`/orders/user/${username}`);

        if (!orders.length) {
          list.innerHTML = `
            <div class="cart-empty">
              <div style="font-size:3rem;margin-bottom:1rem;">📭</div>
              <p>No orders yet</p>
              <small style="color:var(--text-muted);">Place your first order!</small>
            </div>`;
          return;
        }

        list.innerHTML = orders.map(order => {
          const itemSummary = order.items.map(i => `${i.name} ×${i.quantity}`).join(', ');
          return `
            <div class="order-card">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
                <div>
                  <div style="font-size:0.85rem;color:var(--text-muted);">🏷️ ${order.orderId}</div>
                  <div style="font-size:0.85rem;color:var(--text-secondary);">📅 ${formatDate(order.createdAt)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
                  <span class="status-badge ${statusBadgeClass(order.status)}">${order.status}</span>
                  <button class="btn btn-primary btn-sm" onclick="trackOrder('${order.orderId}')">🗺️ Track</button>
                </div>
              </div>
              <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.5rem;">🍽️ ${itemSummary}</div>
              <div style="font-weight:700;color:var(--secondary);">Total: ₹${order.totalPrice}</div>
            </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML = `<div style="padding:1rem;color:var(--danger);">Failed to load orders.</div>`;
      }
    }

    function closeOrderHistory() {
      document.getElementById('orders-modal').classList.remove('active');
    }

    function trackOrder(orderId) {
      savePendingOrderId(orderId);
      closeOrderHistory();
      window.location.href = 'tracking.html';
    }

    document.getElementById('orders-modal').addEventListener('click', function (e) {
      if (e.target === this) closeOrderHistory();
    });
  </script>
  <footer class="site-footer">© 2026 FoodRush | Built using MERN Stack</footer>
</body>
</html>
