<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — FoodRush 🍔</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="bg-gradient"></div>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-container fade-in">

      <div class="auth-logo">
        <span class="logo-icon">🔐</span>
        <h1>FoodRush</h1>
        <p>Reset your password securely</p>
      </div>

      <div class="auth-card">
        <h2 class="auth-title">Forgot Password?</h2>
        <p class="auth-subtitle">Enter your email and verify OTP</p>

        <div id="alert-box"></div>

        <div class="form-group">
          <label class="form-label">📧 Email</label>
          <input
            class="form-input"
            id="fp-email"
            type="email"
            placeholder="Enter your registered email"
            autocomplete="off"
            required
          />
        </div>

        <button class="btn btn-secondary btn-full" id="otp-btn" type="button" onclick="sendResetOtp()">
          Send Reset OTP
        </button>

        <div class="form-group" style="margin-top:1rem;">
          <label class="form-label">✅ OTP</label>
          <input
            class="form-input"
            id="fp-otp"
            type="text"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label class="form-label">🔐 New Password</label>
          <input
            class="form-input"
            id="fp-pass"
            type="password"
            placeholder="Enter new password"
            autocomplete="new-password"
          />
        </div>

        <button class="btn btn-success btn-full" id="reset-btn" type="button" onclick="resetPassword()">
          Reset Password
        </button>

        <p class="auth-footer">
          Remembered password?
          <a href="index.html">Back to login →</a>
        </p>
      </div>

    </div>
  </div>

  <footer class="site-footer">© 2026 FoodRush | Built using MERN Stack</footer>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>

  <script>
    window.addEventListener("load", () => {
      document.getElementById("fp-email").value = "";
      document.getElementById("fp-otp").value = "";
      document.getElementById("fp-pass").value = "";
    });

    async function sendResetOtp() {
      clearAlert("alert-box");

      const email = document.getElementById("fp-email").value.trim();
      const btn = document.getElementById("otp-btn");

      if (!email) {
        return showAlert("alert-box", "Please enter your email.", "error");
      }

      btn.disabled = true;
      btn.textContent = "Sending OTP...";

      try {
        await apiRequest("/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email }),
        });

        showAlert("alert-box", "Reset OTP sent to your email.", "success");
      } catch (err) {
        showAlert("alert-box", err.message, "error");
      }

      btn.disabled = false;
      btn.textContent = "Send Reset OTP";
    }

    async function resetPassword() {
      clearAlert("alert-box");

      const email = document.getElementById("fp-email").value.trim();
      const otp = document.getElementById("fp-otp").value.trim();
      const newPassword = document.getElementById("fp-pass").value;
      const btn = document.getElementById("reset-btn");

      if (!email || !otp || !newPassword) {
        return showAlert("alert-box", "Please fill email, OTP and new password.", "error");
      }

      if (newPassword.length < 6) {
        return showAlert("alert-box", "Password must be at least 6 characters.", "error");
      }

      btn.disabled = true;
      btn.textContent = "Resetting...";

      try {
        await apiRequest("/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ email, otp, newPassword }),
        });

        showToast("Password reset successful! Please login.", "success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);

      } catch (err) {
        showAlert("alert-box", err.message, "error");
      }

      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  </script>
</body>
</html>
